    <style>
      .startup-shell{color:#f2f4f2;background:#0a0a0a;min-height:100vh;font-family:system-ui,sans-serif}

      .startup-logo{background:#202b25;border-radius:50%;width:42px;height:42px;box-shadow:inset 0 0 0 1px #365544}

      .startup-tabs,.startup-search,.startup-grid i{background:#17191a;border:1px solid #292d2f;border-radius:11px;display:block}
